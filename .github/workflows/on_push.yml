name: test on push

on: push

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --locked

      - name: Check code style (Ruff)
        run: uv run ruff check

      - name: Start target app in background
        run: docker run -d --rm -p 5173:5173 hexletprojects/qa_auto_python_testing_kanban_board_project_ru_app

      - name: Run tests
        env:
          APP_BASE_URL: http://localhost:5173/
        run: uv run pytest